name: Profile safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publication-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Scan public profile
        run: python3 scripts/check_profile_safety.py
